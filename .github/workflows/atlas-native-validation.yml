name: Atlas bounded native validation
on:
  push:
    branches: [validation/atlas-native-v1]
    paths:
      - docs/atlas/validation/requests/current.json
permissions:
  contents: read
concurrency:
  group: atlas-validation-${{ github.sha }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Read exact request commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Execute bounded checks
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 docs/atlas/validation/validate_request.py
      - name: Preserve evidence even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: atlas-native-${{ github.sha }}-${{ github.run_attempt }}
          path: validation-evidence/
          if-no-files-found: error
          retention-days: 90
